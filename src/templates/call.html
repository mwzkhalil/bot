<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raqami Bank</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='assets/favicon.ico') }}"
      type="image/x-icon"
    />
    <meta
      name="description"
      content="AI-powered calling solution for your business needs"
    />
  </head>
  <body>
    <!-- Header with logo -->
    <header class="header">
      <div class="logo">
        <img
          src="{{ url_for('static', filename='assets/raqmibank.png') }}"
          alt="Pak Qatar Logo"
        />
        <span class="logo-text">Raqami Bank</span>
      </div>
    </header>

    <!-- Main container -->
    <div class="container">
      <div class="card">
        <h1 class="card-title">AI-Powered Customer Support</h1>
        <p class="card-text" dir="rtl">
          اپنے سوالات کے فوری جوابات کے لیے ہمارے AI اسسٹنٹ سے رابطہ کریں۔ جدید
          آواز کی ٹیکنالوجی کے ذریعے بہترین تجربہ حاصل کریں۔
        </p>

        <button id="callButton" style="color: #00923f">
          <i class="fas fa-phone-alt"></i> Start Call
        </button>
      </div>
    </div>

    <!-- Ring Box for call interface -->
    <div id="ringBox">
      <div class="ring-content">
        <div class="wave"></div>
        <div class="wave" style="animation-delay: 0.6s"></div>
        <div class="wave" style="animation-delay: 1.2s"></div>

        <div class="avatar-container ringing">
          <div class="avatar">
            <i class="fas fa-robot"></i>
          </div>
        </div>

        <div class="call-status">Initializing...</div>
        <div class="timer">00:00:00</div>

        <button id="endCallBtn" style="display: none">
          <i class="fas fa-phone-slash"></i> End Call
        </button>

        <div class="loader" style="display: none">
          <div class="loader-spinner"></div>
          <span>Processing...</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">&copy; 2025 PROXIMA AI. All rights reserved.</footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
